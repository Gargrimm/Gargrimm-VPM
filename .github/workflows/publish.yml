name: Publish package and listing

on:
  push:
    branches: [main]
    paths:
      - 'Packages/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      package:
        description: Package folder to publish (leave empty to rebuild the listing only)
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gargrimm-vpm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish new package versions
        if: github.event_name == 'push' || inputs.package != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_FOLDER: ${{ inputs.package }}
        run: python3 scripts/publish_packages.py
      - name: Build listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build_listing.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish listing to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
